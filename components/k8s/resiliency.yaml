apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: orders-resiliency
  namespace: dapr-demo
scopes:
  - order-receiver
  - order-processor
  - order-fulfillment
spec:
  policies:
    retries:
      pubsubRetry:
        policy: exponential
        maxInterval: 15s
        maxRetries: 5
      statestoreRetry:
        policy: exponential
        maxInterval: 10s
        maxRetries: 5

    circuitBreakers:
      pubsubCB:
        maxRequests: 1
        interval: 30s
        timeout: 20s
        trip: consecutiveFailures >= 5
      statestoreCB:
        maxRequests: 1
        interval: 30s
        timeout: 20s
        trip: consecutiveFailures >= 5

  targets:
    components:
      orderpubsub:
        outbound:
          retry: pubsubRetry
          circuitBreaker: pubsubCB
        inbound:
          retry: pubsubRetry
          circuitBreaker: pubsubCB
      orderstate:
        outbound:
          retry: statestoreRetry
          circuitBreaker: statestoreCB
